<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة — المنيو</title>
<style>
:root{
  --bg:#0b0a08;--surface:#17130e;--surface2:#1f1912;--text:#f5efe3;--muted:#b4a68d;
  --primary:#d4af37;--on-primary:#191307;--border:rgba(255,255,255,.09);
  --ok:#34d399;--bad:#f87171;--warn:#fbbf24;--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 70% at 88% -8%,rgba(212,175,55,.13),transparent 62%),var(--bg);
  color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}

/* ============ login ============ */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:30px 24px;text-align:center;box-shadow:0 26px 70px rgba(0,0,0,.5)}
.login-mark{width:64px;height:64px;margin:0 auto 16px;border-radius:19px;background:linear-gradient(145deg,var(--primary),#a9862a);
  color:var(--on-primary);display:grid;place-items:center;font-size:1.5rem;font-weight:900}
.login-card h1{margin:0 0 4px;font-size:1.22rem}
.login-card p{margin:0 0 22px;color:var(--muted);font-size:.86rem}
.field{text-align:start;margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font-size:.94rem;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--primary)}
textarea.inp{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;
  border:1px solid transparent;background:var(--surface2);color:var(--text);font-weight:700;font-size:.88rem;cursor:pointer;transition:.14s}
.btn:hover{filter:brightness(1.12)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-danger{background:rgba(248,113,113,.14);color:#fca5a5;border-color:rgba(248,113,113,.3)}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.32);color:#fca5a5;
  padding:9px 12px;border-radius:10px;font-size:.82rem;margin-bottom:12px;text-align:start}
.hint{font-size:.76rem;color:var(--muted);margin-top:6px;display:block}

/* ============ shell ============ */
header.top{position:sticky;top:0;z-index:40;background:rgba(11,10,8,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:10px 14px}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--primary),#a9862a);
  color:var(--on-primary);display:grid;place-items:center;font-weight:900;font-size:.9rem}
.brand b{font-size:.9rem;display:block;line-height:1.2}
.brand span{font-size:.7rem;color:var(--muted)}
.pill{margin-inline-start:auto;display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--muted);
  border:1px solid var(--border);border-radius:999px;padding:5px 11px;background:var(--surface)}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.dirty .d{background:var(--warn)}

nav.tabs{max-width:1180px;margin:12px auto 0;display:flex;gap:7px;overflow-x:auto;padding:0 14px 2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:8px 15px;
  border-radius:999px;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.active{background:var(--primary);color:var(--on-primary);border-color:transparent}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 3px;font-size:1rem}
.panel .sub{color:var(--muted);font-size:.8rem;margin:0 0 14px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.stat{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat .box{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:13px}
.stat .box span{font-size:.74rem;color:var(--muted);display:block}
.stat .box strong{font-size:1.3rem;display:block;margin-top:2px}

/* ============ lists ============ */
.list{display:flex;flex-direction:column;gap:9px}
.item-row{display:flex;gap:11px;align-items:center;background:var(--surface2);border:1px solid var(--border);
  border-radius:13px;padding:9px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#000;flex:none;display:grid;place-items:center;
  color:var(--primary);font-weight:900;font-size:1.2rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item-row .info{flex:1;min-width:0}
.item-row .info b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row .info span{font-size:.75rem;color:var(--muted)}
.acts{display:flex;gap:5px;flex:none}
.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.14s}
.iconbtn:hover{color:var(--text);border-color:var(--primary)}
.iconbtn svg{width:15px;height:15px}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:.85rem}

/* ============ design ============ */
.presets{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.preset{border:2px solid var(--border);border-radius:13px;padding:9px;cursor:pointer;background:var(--surface2);text-align:center;transition:.15s}
.preset.active{border-color:var(--primary)}
.preset .sw{display:flex;gap:3px;margin-bottom:6px}
.preset .sw i{flex:1;height:20px;border-radius:5px;display:block}
.preset small{font-size:.72rem;color:var(--muted)}
input[type=color]{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);padding:3px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--primary)}

/* ============ preview ============ */
.preview{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#000}
.preview iframe{width:100%;height:520px;border:0;display:block;background:#0b0a08}
.preview .bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:.76rem;color:var(--muted)}

/* ============ modal ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:70;display:grid;
  place-items:center;padding:14px;overflow:auto}
.modal{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:20px;max-height:92vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 14px;font-size:1.02rem}
.imgpick{display:flex;gap:11px;align-items:center}
.imgpreview{width:78px;height:78px;border-radius:11px;background:var(--surface2);border:1px dashed var(--border);
  display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:.68rem;text-align:center}
.imgpreview img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;inset-inline:12px;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:90}
.toast span{background:var(--surface2);border:1px solid var(--border);padding:9px 18px;border-radius:999px;
  font-size:.82rem;opacity:0;transform:translateY(8px);transition:.25s;max-width:92vw;text-align:center}
.toast.show span{opacity:1;transform:none}
.note{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:11px;padding:10px 12px;
  font-size:.78rem;color:#fcd34d;margin-top:12px}
.qrbox{display:grid;place-items:center;gap:12px}
.qrbox img{width:220px;height:220px;border-radius:12px;background:#fff;padding:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ======================= تسجيل الدخول ======================= -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="login-mark">S</div>
    <h1>لوحة إدارة المنيو</h1>
    <p>أدخل كلمة المرور للدخول — لا يوجد اسم مستخدم</p>

    <div class="field">
      <label for="pw">كلمة المرور</label>
      <input class="inp" id="pw" type="password" dir="ltr" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <div class="err hidden" id="loginErr"></div>
    <button class="btn btn-primary btn-block" type="submit">دخول</button>
    <span class="hint">كلمة المرور المبدئية: <b dir="ltr">12345678</b> — غيّرها من «الإعدادات» بعد الدخول.</span>
  </form>
</div>

<!-- ======================= التطبيق ======================= -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="mk">S</div>
        <div><b>لوحة الإدارة</b><span class="brand-sub">نسخة مستقلة — بلا خادم</span></div>
      </div>
      <div class="pill" id="savePill"><span class="d"></span><span id="saveText">محفوظ في هذا المتصفح</span></div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="overview">نظرة عامة</button>
      <button class="tab" data-view="products">المنتجات</button>
      <button class="tab" data-view="categories">الأقسام</button>
      <button class="tab" data-view="restaurant">المطعم</button>
      <button class="tab" data-view="design">التصميم</button>
      <button class="tab" data-view="qr">QR Code</button>
      <button class="tab" data-view="backup">نسخ احتياطي</button>
      <button class="tab" data-view="settings">الإعدادات</button>
    </nav>
  </header>
  <div class="wrap" id="viewRoot"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"><span></span></div>

<!-- مكتبة توليد QR (qrcode-generator، MIT — مضمّنة داخل الملف ليعمل بدون إنترنت) -->
<script id="qrlib">//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

<script>
(function () {

     ============================================================ */
  var DB_KEY = 'smos.data.v1';
  var CHANNEL = 'smos-sync';

  var PRESETS = {
    'luxury-gold': { name:'فاخر ذهبي', bg:'#0b0a08', surface:'#17130e', surface2:'#1f1912', text:'#f5efe3', muted:'#b4a68d', primary:'#d4af37', onPrimary:'#191307', font:'Cairo' },

    'modern-minimal': { name:'حديث بسيط', bg:'#ffffff', surface:'#f7f7f8', surface2:'#efeff1', text:'#111315', muted:'#6b7075', primary:'#111315', onPrimary:'#ffffff', font:'Segoe UI' },
    'emerald':     { name:'زمردي', bg:'#05100c', surface:'#0c1f18', surface2:'#122a21', text:'#ecf7f2', muted:'#96b3a8', primary:'#2fbf8f', onPrimary:'#04150f', font:'Cairo' },
    'burgundy':    { name:'عنّابي', bg:'#140a0d', surface:'#221016', surface2:'#2c1620', text:'#f9edf1', muted:'#c0a3ac', primary:'#d4788f', onPrimary:'#1b0910', font:'El Messiri' }

  function defaultDB() {
    return {
      version: 1, rev: 1, updatedAt: Date.now(),
      restaurant: { name:'مطعمي', tagline:'منيو إلكتروني', phone:'', address:'', hours:'', logo:'', currency:'ج.م' },
      design: { preset:'luxury-gold', primary:'', bg:'', radius:18, layout:'grid', showSearch:true },
      categories: [{ id:'c1', name:'الأطباق الرئيسية', sort:1 }],
      items: [],
      security: { passHash: 'ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f', hint:'' }
    };
  }

  function readDB() {
    try {
      var raw = localStorage.getItem(DB_KEY);
      if (!raw) {
        var seed = defaultDB();
        try { localStorage.setItem(DB_KEY, JSON.stringify(seed)); } catch (e) {}
        return seed;
      }
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return defaultDB();
      d.restaurant = d.restaurant || defaultDB().restaurant;
      d.design = d.design || defaultDB().design;
      d.categories = Array.isArray(d.categories) ? d.categories : [];
      d.items = Array.isArray(d.items) ? d.items : [];
      d.security = d.security || defaultDB().security;
      return d;
    } catch (e) { return defaultDB(); }
  }

  var DB = readDB();
  var bc = null;
  try { bc = new BroadcastChannel(CHANNEL); } catch (e) { bc = null; }

  function persist(silent) {
    DB.rev = (DB.rev || 0) + 1;
    DB.updatedAt = Date.now();
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(DB));
    } catch (e) {
      toast('⚠ مساحة التخزين ممتلئة — احذف بعض الصور أو صدّر نسخة احتياطية');
      return false;
    }
    if (bc) { try { bc.postMessage({ type:'update', rev: DB.rev }); } catch (e) {} }
    if (!silent) flashSaved();
    schedulePush();
    return true;
  }

  function uid(p) { return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function $ (sel, root) { return (root || document).querySelector(sel); }
  function $$ (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  var toastT;
  function toast(msg) {
    var t = $('#toast'); t.firstElementChild.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  var saveT;
  function flashSaved() {
    var pill = $('#savePill'), txt = $('#saveText');
    if (!pill) return;

    txt.textContent = 'جارٍ الحفظ…';
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      pill.classList.remove('dirty');
      txt.textContent = syncText;
    }, 450);
  }

  /* ============================================================
     كلمة المرور (SHA-256 داخل المتصفح)
     ============================================================ */
  function sha256(str) {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      });
    }
    // بديل بسيط إن لم يتوفر crypto.subtle
    var h1 = 0x811c9dc5, h2 = 0x1000193;
    for (var i = 0; i < str.length; i++) {
      h1 ^= str.charCodeAt(i); h1 = (h1 * 16777619) >>> 0;
      h2 = (h2 + str.charCodeAt(i) * (i + 7)) >>> 0;
    }
    return Promise.resolve('fb' + h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0'));
  }

  function isLoggedIn() {
    try { return sessionStorage.getItem('smos.admin.session') === '1'; } catch (e) { return false; }
  }
  function setLoggedIn(v) {
    try { v ? sessionStorage.setItem('smos.admin.session', '1') : sessionStorage.removeItem('smos.admin.session'); } catch (e) {}
  }

  /* ============================================================
     الصور: ضغط وتصغير داخل المتصفح
     ============================================================ */
  function fileToDataURL(file, maxSide, cb) {
    if (!file || !/^image\//.test(file.type)) { cb('الملف ليس صورة'); return; }
    if (file.size > 12 * 1024 * 1024) { cb('الصورة كبيرة جدًا (الحد 12 ميجا)'); return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, (maxSide || 1000) / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, cw, ch);
        var out;
        try { out = cv.toDataURL('image/webp', 0.85); } catch (err) { out = null; }
        if (!out || out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/jpeg', 0.85);
        cb(null, out);
      };
      img.onerror = function () { cb('تعذر قراءة الصورة'); };
      img.src = e.target.result;
    };
    reader.onerror = function () { cb('تعذر قراءة الملف'); };
    reader.readAsDataURL(file);
  }

  /* ============================================================
     التنقل
     ============================================================ */
  var view = 'overview';

  function setView(v) {
    view = v;
    $$('.tab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-view') === v); });
    render();
  }

  function render() {
    var root = $('#viewRoot');
    if (!root) return;
    if (view === 'overview') return drawOverview(root);
    if (view === 'products') return drawProducts(root);
    if (view === 'categories') return drawCategories(root);
    if (view === 'restaurant') return drawRestaurant(root);
    if (view === 'design') return drawDesign(root);
    if (view === 'qr') return drawQR(root);
    if (view === 'backup') return drawBackup(root);
    if (view === 'settings') return drawSettings(root);
  }

  /* ---------------------------- نظرة عامة ---------------------------- */
  function drawOverview(root) {
    var items = DB.items.length;
    var avail = DB.items.filter(function (i) { return i.available !== false; }).length;
    var noImg = DB.items.filter(function (i) { return !i.image; }).length;
    var bytes = 0;
    try { bytes = (localStorage.getItem(DB_KEY) || '').length * 2; } catch (e) {}
    var kb = Math.round(bytes / 1024);

    root.innerHTML =
      '<div class="panel"><h2>مرحبًا، ' + esc(DB.restaurant.name || 'صاحب المطعم') + '</h2>' +
      '<p class="sub">كل تعديل تنفّذه هنا يظهر فورًا في صفحة المنيو المفتوحة على نفس الجهاز.</p>' +
      '<div class="stat">' +
        '<div class="box"><span>المنتجات</span><strong>' + items + '</strong></div>' +
        '<div class="box"><span>متاح</span><strong style="color:var(--ok)">' + avail + '</strong></div>' +
        '<div class="box"><span>الأقسام</span><strong>' + DB.categories.length + '</strong></div>' +
        '<div class="box"><span>بدون صورة</span><strong style="color:' + (noImg ? 'var(--warn)' : 'var(--ok)') + '">' + noImg + '</strong></div>' +
        '<div class="box"><span>حجم البيانات</span><strong>' + kb + ' KB</strong></div>' +
      '</div></div>' +

      '<div class="panel"><h2>المعاينة الحيّة</h2>' +
      '<p class="sub">هذه هي صفحة المنيو الفعلية داخل إطار — تتحدّث تلقائيًا مع كل تعديل.</p>' +
      '<div class="preview"><div class="bar"><span>menu.html</span><span style="margin-inline-start:auto"><button class="btn btn-sm btn-ghost" id="openMenu">فتح في تبويب</button></span></div>' +
      '<iframe id="previewFrame" src="menu.html" title="معاينة المنيو"></iframe></div></div>' +

      '<div class="panel"><h2>خطوات سريعة</h2>' +
      '<div class="row"><button class="btn btn-primary" data-goto="products">إضافة منتج</button>' +
      '<button class="btn btn-ghost" data-goto="design">تغيير التصميم</button>' +
      '<button class="btn btn-ghost" data-goto="qr">إنشاء QR</button></div></div>';

    $('#openMenu').onclick = function () { window.open('menu.html', '_blank'); };
    $$('[data-goto]', root).forEach(function (b) {
      b.onclick = function () { setView(b.getAttribute('data-goto')); };
    });
  }

  /* ---------------------------- المنتجات ---------------------------- */
  function drawProducts(root) {
    var cats = DB.categories.slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    var sorted = DB.items.slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });

    var rows = sorted.map(function (it, idx) {
      var cat = cats.filter(function (c) { return c.id === it.categoryId; })[0];
      return '<div class="item-row" data-id="' + esc(it.id) + '">' +
        '<div class="thumb">' + (it.image ? '<img alt="" src="' + it.image + '">' : esc((it.name || '؟').charAt(0))) + '</div>' +
        '<div class="info"><b>' + esc(it.name) + '</b><span>' +
          (cat ? esc(cat.name) : 'بدون قسم') + ' · ' + (it.price === '' || it.price == null ? 'بدون سعر' : esc(it.price) + ' ' + esc(DB.restaurant.currency)) +
          (it.available === false ? ' · <b style="color:#fca5a5">غير متوفر</b>' : '') +
        '</span></div>' +
        '<div class="acts">' +
          '<button class="iconbtn" data-up="' + idx + '" title="أعلى">▲</button>' +
          '<button class="iconbtn" data-down="' + idx + '" title="أسفل">▼</button>' +
          '<button class="iconbtn" data-edit="' + esc(it.id) + '" title="تعديل">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4l10-10-4-4L4 16v4Z"/></svg></button>' +
          '<button class="iconbtn" data-del="' + esc(it.id) + '" title="حذف">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>' +
        '</div></div>';
    }).join('');

    root.innerHTML =
      '<div class="panel"><div class="row" style="justify-content:space-between">' +
        '<div><h2>المنتجات</h2><p class="sub" style="margin:0">' + DB.items.length + ' منتج</p></div>' +
        '<button class="btn btn-primary" id="addItem">+ إضافة منتج</button></div></div>' +
      '<div class="panel" style="padding:10px">' + (rows || '<div class="empty">لا توجد منتجات بعد — اضغط «إضافة منتج».</div>') + '</div>';

    $('#addItem').onclick = function () { itemModal(null); };
    $$('[data-edit]', root).forEach(function (b) { b.onclick = function () { itemModal(b.getAttribute('data-edit')); }; });
    $$('[data-del]', root).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-del');
        var it = DB.items.filter(function (x) { return x.id === id; })[0] || {};
        if (!confirm('حذف «' + (it.name || '') + '»؟')) return;
        DB.items = DB.items.filter(function (x) { return x.id !== id; });
        persist(); render(); toast('تم الحذف');
      };
    });
    $$('[data-up]', root).forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-up');
        if (i <= 0) return;
        var arr = DB.items.slice().sort(function (a, c) { return (a.sort || 0) - (c.sort || 0); });
        arr[i].sort = i; arr[i - 1].sort = i + 1;
        arr.forEach(function (x, k) { x.sort = k + 1; });
        DB.items = arr; persist(); render();
      };
    });
    $$('[data-down]', root).forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-down');
        var arr = DB.items.slice().sort(function (a, c) { return (a.sort || 0) - (c.sort || 0); });
        if (i >= arr.length - 1) return;
        arr[i].sort = i + 2; arr[i + 1].sort = i + 1;
        arr.forEach(function (x, k) { x.sort = k + 1; });
        DB.items = arr; persist(); render();
      };
    });
  }

  function itemModal(id) {
    var it = id ? DB.items.filter(function (x) { return x.id === id; })[0] : null;
    var isNew = !it;
    it = it || { id: uid('item'), name:'', desc:'', price:'', image:'', categoryId: (DB.categories[0] || {}).id || '', available:true, featured:false, sort: DB.items.length + 1 };
    var cats = DB.categories.slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });

    openModal(
      '<h3>' + (isNew ? 'منتج جديد' : 'تعديل المنتج') + '</h3>' +
      '<div class="field"><label>اسم المنتج *</label><input class="inp" id="mName" value="' + esc(it.name) + '" placeholder="مثال: مشاوي مشكلة"></div>' +
      '<div class="field"><label>الوصف</label><textarea class="inp" id="mDesc" placeholder="مكونات الطبق…">' + esc(it.desc) + '</textarea></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>السعر</label><input class="inp" id="mPrice" type="number" min="0" step="0.5" value="' + esc(it.price) + '" placeholder="0"></div>' +
        '<div class="field"><label>القسم</label><select class="inp" id="mCat">' +
          cats.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === it.categoryId ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') +
          '<option value="">بدون قسم</option></select></div>' +
      '</div>' +
      '<div class="field"><label>صورة المنتج</label><div class="imgpick">' +

        '<span class="hint">تُضغط الصورة تلقائيًا لتناسب التخزين المحلي.</span></div>' +
      '</div></div>' +
      '<div class="row" style="gap:16px;margin-bottom:14px">' +
        '<label style="display:flex;align-items:center;gap:7px;font-size:.85rem"><input type="checkbox" id="mAvail"' + (it.available !== false ? ' checked' : '') + '> متوفر</label>' +
        '<label style="display:flex;align-items:center;gap:7px;font-size:.85rem"><input type="checkbox" id="mFeat"' + (it.featured ? ' checked' : '') + '> مميز</label>' +
      '</div>' +
      '<div class="err hidden" id="mErr"></div>' +
      '<div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-close>إلغاء</button>' +
      '<button class="btn btn-primary" id="mSave">حفظ</button></div>'
    );

    var imgData = it.image || '';
    $('#mFile').onchange = function (e) {
      var f = e.target.files[0];
      if (!f) return;
      fileToDataURL(f, 1000, function (err, data) {
        if (err) { showErr('mErr', err); return; }
        imgData = data;
        $('#mPrev').innerHTML = '<img src="' + data + '">';
      });
    };
    $('#mSave').onclick = function () {
      var name = $('#mName').value.trim();
      if (!name) return showErr('mErr', 'اسم المنتج مطلوب');
      var priceRaw = $('#mPrice').value;
      var rec = {
        id: it.id, name: name, desc: $('#mDesc').value.trim(),
        price: priceRaw === '' ? '' : Number(priceRaw),
        categoryId: $('#mCat').value, image: imgData,
        available: $('#mAvail').checked, featured: $('#mFeat').checked,
        sort: it.sort || (DB.items.length + 1)
      };
      if (isNew) DB.items.push(rec);
      else DB.items = DB.items.map(function (x) { return x.id === rec.id ? rec : x; });
      if (!persist()) return;
      closeModal(); render(); toast(isNew ? 'تمت إضافة المنتج ✓' : 'تم تحديث المنتج ✓');
    };
  }

  /* ---------------------------- الأقسام ---------------------------- */
  function drawCategories(root) {
    var cats = DB.categories.slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    var rows = cats.map(function (c, i) {
      var n = DB.items.filter(function (x) { return x.categoryId === c.id; }).length;
      return '<div class="item-row"><div class="thumb" style="font-size:.95rem">' + (i + 1) + '</div>' +
        '<div class="info"><b>' + esc(c.name) + '</b><span>' + n + ' منتج</span></div>' +
        '<div class="acts">' +
          '<button class="iconbtn" data-rep="' + esc(c.id) + '" title="تعديل">✎</button>' +
          '<button class="iconbtn" data-cdel="' + esc(c.id) + '" title="حذف">🗑</button>' +
        '</div></div>';
    }).join('');

    root.innerHTML =
      '<div class="panel"><div class="row" style="justify-content:space-between">' +
        '<div><h2>الأقسام</h2><p class="sub" style="margin:0">ترتيب ظهور الأقسام في المنيو</p></div>' +
        '<button class="btn btn-primary" id="addCat">+ قسم جديد</button></div></div>' +
      '<div class="panel" style="padding:10px">' + (rows || '<div class="empty">لا توجد أقسام.</div>') + '</div>' +
      '<div class="panel"><div class="field" style="margin:0"><label>إضافة سريعة</label>' +
        '<div class="row"><input class="inp" id="quickCat" placeholder="اسم القسم" style="flex:1;min-width:150px">' +
        '<button class="btn btn-primary" id="quickAdd">إضافة</button></div></div></div>';

    function addCat(name) {
      name = String(name || '').trim();
      if (!name) return;
      DB.categories.push({ id: uid('cat'), name: name, sort: DB.categories.length + 1 });
      persist(); render(); toast('تمت إضافة القسم ✓');
    }
    $('#addCat').onclick = function () { addCat(prompt('اسم القسم الجديد:')); };
    $('#quickAdd').onclick = function () { addCat($('#quickCat').value); };
    $('#quickCat').onkeydown = function (e) { if (e.key === 'Enter') addCat($('#quickCat').value); };

    $$('[data-rep]', root).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-rep');
        var c = DB.categories.filter(function (x) { return x.id === id; })[0];
        var name = prompt('اسم القسم:', c.name);
        if (name === null) return;
        name = name.trim(); if (!name) return;
        c.name = name; persist(); render(); toast('تم التعديل ✓');
      };
    });
    $$('[data-cdel]', root).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-cdel');
        var c = DB.categories.filter(function (x) { return x.id === id; })[0];
        var n = DB.items.filter(function (x) { return x.categoryId === id; }).length;
        if (!confirm('حذف قسم «' + c.name + '»؟' + (n ? '\nسيتم نقل ' + n + ' منتج إلى «بدون قسم».' : ''))) return;
        DB.categories = DB.categories.filter(function (x) { return x.id !== id; });
        DB.items.forEach(function (x) { if (x.categoryId === id) x.categoryId = ''; });
        persist(); render(); toast('تم حذف القسم');
      };
    });
  }

  /* ---------------------------- المطعم ---------------------------- */
  function drawRestaurant(root) {

      '<div class="grid2">' +
        '<div class="field"><label>اسم المطعم</label><input class="inp" id="rName" value="' + esc(r.name) + '"></div>' +
        '<div class="field"><label>العبارة التعريفية</label><input class="inp" id="rTag" value="' + esc(r.tagline) + '"></div>' +

        '<button class="btn btn-sm btn-ghost" id="logoClear" style="margin-top:7px">إزالة الشعار</button></div>' +

    $('#saveRest').onclick = function () {

  /* ---------------------------- التصميم ---------------------------- */
  function drawDesign(root) {
    var d = DB.design;
    var presets = Object.keys(PRESETS).map(function (k) {
      var p = PRESETS[k];
      return '<div class="preset' + (d.preset === k ? ' active' : '') + '" data-preset="' + k + '">' +
        '<div class="sw"><i style="background:' + p.bg + ';border:1px solid rgba(255,255,255,.12)"></i>' +
        '<i style="background:' + p.surface + '"></i><i style="background:' + p.primary + '"></i></div>' +
        '<small>' + p.name + '</small></div>';
    }).join('');

    root.innerHTML =
      '<div class="panel"><h2>مركز التصميم</h2><p class="sub">اختر قالبًا — يُطبَّق على المنيو فورًا</p>' +
      '<div class="presets">' + presets + '</div></div>' +

      '<div class="panel"><h2>تخصيص</h2>' +
      '<div class="grid2">' +
        '<div class="field"><label>اللون الأساسي</label><input type="color" id="cPrimary" value="' + (d.primary || PRESETS[d.preset].primary) + '"></div>' +
        '<div class="field"><label>لون الخلفية</label><input type="color" id="cBg" value="' + (d.bg || PRESETS[d.preset].bg) + '"></div>' +
      '</div>' +
      '<div class="field"><label>استدارة الحواف: <b id="radVal">' + (d.radius || 18) + 'px</b></label>' +
        '<input type="range" id="rad" min="0" max="30" value="' + (d.radius || 18) + '"></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>شكل العرض</label><select class="inp" id="layout">' +
          '<option value="grid"' + (d.layout !== 'list' ? ' selected' : '') + '>بطاقات (شبكة)</option>' +
          '<option value="list"' + (d.layout === 'list' ? ' selected' : '') + '>قائمة صفوف</option></select></div>' +
      '</div>' +
      '<div class="row"><button class="btn btn-primary" id="saveDesign">حفظ التصميم</button>' +
      '<button class="btn btn-ghost" id="resetDesign">استعادة الافتراضي</button></div></div>' +

      '<div class="panel"><h2>المعاينة</h2><div class="preview"><div class="bar"><span>menu.html</span></div>' +
      '<iframe id="dFrame" src="menu.html" title="معاينة"></iframe></div></div>';

    var chosen = d.preset;
    $$('[data-preset]', root).forEach(function (el) {
      el.onclick = function () {
        chosen = el.getAttribute('data-preset');
        $$('[data-preset]', root).forEach(function (x) { x.classList.toggle('active', x === el); });
        $('#cPrimary').value = PRESETS[chosen].primary;
        $('#cBg').value = PRESETS[chosen].bg;
      };
    });
    $('#rad').oninput = function () { $('#radVal').textContent = this.value + 'px'; };
    $('#saveDesign').onclick = function () {
      DB.design = {
        preset: chosen,
        primary: $('#cPrimary').value,
        bg: $('#cBg').value,
        radius: +$('#rad').value,
        layout: $('#layout').value,
        showSearch: true
      };
      persist(); render(); toast('تم حفظ التصميم ✓ — شاهد المعاينة');
    };
    $('#resetDesign').onclick = function () {
      DB.design = { preset:'luxury-gold', primary:'', bg:'', radius:18, layout:'grid', showSearch:true };
      persist(); render(); toast('تمت استعادة التصميم الافتراضي');

  /* ---------------------------- QR ---------------------------- */
  function drawQR(root) {
    root.innerHTML =
      '<div class="panel"><h2>QR Code</h2>' +
      '<p class="sub">أدخل رابط المنيو بعد نشره على الإنترنت، ثم نزّل الرمز واطبعه.</p>' +
      '<div class="field"><label>رابط المنيو</label>' +
        '<input class="inp" id="qrUrl" dir="ltr" placeholder="https://example.com/menu.html"></div>' +
      '<div class="row"><button class="btn btn-primary" id="genQR">توليد الرمز</button>' +
      '<button class="btn btn-ghost" id="dlPng" disabled>تنزيل PNG</button></div>' +
      '<div class="qrbox" id="qrOut" style="margin-top:16px"></div>' +
      '<div class="note">الرابط معبّأ تلقائيًا برابط موقعك على كلود فلير (صفحة المنيو). لو ربطت دومين خاص غيّر الرابط هنا وولّد الرمز من جديد.</div>' +
      '</div>';

    var lastQR = null;
    if (/^https?:$/.test(location.protocol)) {
      $('#qrUrl').value = location.origin + '/';
      setTimeout(function () { $('#genQR').click(); }, 0);
    }
    function gen() {
      var url = $('#qrUrl').value.trim();
      if (!url) return toast('أدخل الرابط أولًا');
      try {
        var qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        lastQR = qr;
        var n = qr.getModuleCount();
        var svg = qr.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
        $('#qrOut').innerHTML = svg;
        var svgEl = $('#qrOut').querySelector('svg');
        if (svgEl) { svgEl.style.width = '230px'; svgEl.style.height = '230px'; svgEl.style.background = '#fff'; svgEl.style.borderRadius = '12px'; svgEl.style.padding = '8px'; }
        $('#dlPng').disabled = false;
      } catch (e) { toast('تعذر توليد الرمز: ' + e.message); }
    }
    $('#genQR').onclick = gen;
    $('#qrUrl').onkeydown = function (e) { if (e.key === 'Enter') gen(); };
    $('#dlPng').onclick = function () {
      if (!lastQR) return;
      var n = lastQR.getModuleCount(), cell = 16, margin = 4 * cell;
      var size = n * cell + margin * 2;
      var cv = document.createElement('canvas'); cv.width = cv.height = size;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#000';
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++)
        if (lastQR.isDark(r, c)) ctx.fillRect(margin + c * cell, margin + r * cell, cell, cell);
      var a = document.createElement('a');
      a.href = cv.toDataURL('image/png');
      a.download = 'qr-menu.png';
      a.click();
    };
  }

  /* ---------------------------- نسخ احتياطي ---------------------------- */
  function drawBackup(root) {
    var items = DB.items.length, imgCount = DB.items.filter(function (i) { return i.image; }).length;
    root.innerHTML =
      '<div class="panel"><h2>نسخة احتياطية</h2>' +
      '<p class="sub">البيانات محفوظة داخل هذا المتصفح فقط. صدّر نسخة احتياطية بانتظام.</p>' +
      '<div class="stat" style="margin-bottom:14px">' +
        '<div class="box"><span>منتجات</span><strong>' + items + '</strong></div>' +
        '<div class="box"><span>صور</span><strong>' + imgCount + '</strong></div>' +
        '<div class="box"><span>أقسام</span><strong>' + DB.categories.length + '</strong></div>' +
      '</div>' +
      '<div class="row"><button class="btn btn-primary" id="exp">تنزيل نسخة (JSON)</button>' +
      '<label class="btn btn-ghost" style="cursor:pointer">استيراد نسخة<input type="file" id="imp" accept="application/json,.json" hidden></label>' +
      '<button class="btn btn-danger" id="wipe">مسح كل البيانات</button></div>' +
      '<div class="note">الاستيراد يستبدل كل البيانات الحالية بالنسخة المختارة.</div></div>';

    $('#exp').onclick = function () {
      var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'menu-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    };
    $('#imp').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          if (!d || !Array.isArray(d.items)) throw new Error('ملف غير صالح');
          if (!confirm('استبدال كل البيانات الحالية؟')) return;
          DB = d;
          DB.rev = (DB.rev || 0) + 1;
          persist(true); render(); toast('تم الاستيراد ✓');
        } catch (err) { toast('ملف غير صالح: ' + err.message); }
      };
      fr.readAsText(f);
    };
    $('#wipe').onclick = function () {
      if (!confirm('سيتم حذف كل الأصناف والأقسام والتصميم. متابعة؟')) return;
      if (!confirm('تأكيد نهائي: هل صدّرت نسخة احتياطية؟')) return;
      var keep = DB.security;
      DB = defaultDB(); DB.security = keep;
      persist(true); render(); toast('تم مسح البيانات');
    };
  }

  /* ---------------------------- الإعدادات ---------------------------- */
  function drawSettings(root) {
    root.innerHTML =
      '<div class="panel"><h2>تغيير كلمة المرور</h2>' +
      '<p class="sub">كلمة المرور المبدئية <b dir="ltr">12345678</b> — يُنصح بتغييرها.</p>' +
      '<div class="field"><label>كلمة المرور الحالية</label><input class="inp" id="pwOld" type="password" dir="ltr" autocomplete="current-password"></div>' +
      '<div class="field"><label>كلمة المرور الجديدة</label><input class="inp" id="pwNew" type="password" dir="ltr" autocomplete="new-password"></div>' +
      '<div class="field"><label>تأكيد كلمة المرور الجديدة</label><input class="inp" id="pwNew2" type="password" dir="ltr" autocomplete="new-password"></div>' +
      '<div class="err hidden" id="pwErr"></div>' +
      '<button class="btn btn-primary" id="savePw">حفظ كلمة المرور</button>' +
      '<div class="note">⚠ في هذه النسخة المستقلة الحماية داخل المتصفح فقط (وليست حماية خادم): أي شخص يفتح الملف على جهازك يمكنه قراءة البيانات. للحماية الحقيقية استخدم نسخة الخادم المرفقة.</div></div>' +

      '<div class="panel"><h2>الجلسة</h2>' +
      '<div class="row"><button class="btn btn-ghost" id="logout">تسجيل الخروج</button></div>' +
      '<div class="note">الجلسة مرتبطة بهذا التبويب فقط — إغلاق التبويب يسجّل الخروج.</div></div>';

    $('#savePw').onclick = function () {
      var oldv = $('#pwOld').value, nv = $('#pwNew').value, nv2 = $('#pwNew2').value;
      sha256(oldv).then(function (h) {
        if (h !== DB.security.passHash) return showErr('pwErr', 'كلمة المرور الحالية غير صحيحة');
        if (nv.length < 8) return showErr('pwErr', 'كلمة المرور الجديدة يجب أن تكون 8 أحرف على الأقل');
        if (nv !== nv2) return showErr('pwErr', 'كلمتا المرور غير متطابقتين');
        sha256(nv).then(function (nh) {
          DB.security.passHash = nh;
          persist(); toast('تم تغيير كلمة المرور ✓');
          $('#pwOld').value = $('#pwNew').value = $('#pwNew2').value = '';
          showErr('pwErr', '');
        });
      });
    };
    $('#logout').onclick = function () {
      setLoggedIn(false);
      location.reload();
    };
  }

  /* ============================================================
     Modal helpers
     ============================================================ */
  function openModal(html) {
    var root = $('#modalRoot');
    root.innerHTML = '<div class="modal-bg" id="mbg"><div class="modal">' + html + '</div></div>';
    $('#mbg').addEventListener('click', function (e) {
      if (e.target.id === 'mbg' || e.target.closest('[data-close]')) closeModal();
    });
    var first = $('#mbg').querySelector('input,textarea,select');
    if (first) setTimeout(function () { first.focus(); }, 90);
  }
  function closeModal() { $('#modalRoot').innerHTML = ''; }
  function showErr(id, msg) {
    var el = $('#' + id);
    if (!el) return;
    if (!msg) { el.classList.add('hidden'); el.textContent = ''; return; }
    el.textContent = msg; el.classList.remove('hidden');
  }

  /* ============================================================
     التشغيل
     ============================================================ */

  /* ============================================================
     المزامنة مع كلود فلير (Pages Functions + KV)
     ============================================================ */
  var syncText = 'محفوظ في هذا المتصفح';
  var AUTH_KEY = 'smos.admin.auth';
  function getAuth() { try { return sessionStorage.getItem(AUTH_KEY) || ''; } catch (e) { return ''; } }
  function setAuth(h) { try { h ? sessionStorage.setItem(AUTH_KEY, h) : sessionStorage.removeItem(AUTH_KEY); } catch (e) {} }
  function setSync(t) {
    syncText = t;
    var el = document.getElementById('saveText');
    if (el && !(document.getElementById('savePill') || {classList:{contains:function(){return false;}}}).classList.contains('dirty')) el.textContent = t;
  }
  var pushT = null, pushing = false, pushAgain = false;
  function schedulePush() {
    if (!/^https?:$/.test(location.protocol)) return;
    setSync('جارٍ النشر…');
    clearTimeout(pushT);
    pushT = setTimeout(doPush, 700);
  }
  function doPush() {
    if (pushing) { pushAgain = true; return; }
    var auth = getAuth();
    if (!auth) { setSync('محفوظ محليًا — سجّل الدخول من جديد للنشر'); return; }
    pushing = true;
    fetch('/api/data', {
      method: 'PUT',
      headers: { 'content-type': 'application/json', 'x-auth': auth },
      body: JSON.stringify(DB)
    }).then(function (r) {
      pushing = false;
      if (r.ok) {
        if (DB.security && DB.security.passHash) setAuth(DB.security.passHash);
        setSync('تم النشر على الإنترنت ✓');
      } else if (r.status === 401) setSync('تعذّر النشر: سجّل الدخول من جديد');
      else if (r.status === 413) setSync('تعذّر النشر: البيانات كبيرة (قلّل حجم الصور)');
      else setSync('تعذّر النشر (' + r.status + ') — تأكد من ربط KV');
      if (pushAgain) { pushAgain = false; doPush(); }
    }).catch(function () {
      pushing = false;
      setSync('محفوظ محليًا — لا يوجد اتصال بالخادم');
    });
  }
  // تسجيل الدخول عبر الخادم: يرجّع البيانات الأحدث من أي جهاز
  function serverLogin(hash) {
    if (!/^https?:$/.test(location.protocol)) return Promise.resolve({ offline: true });
    return fetch('/api/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ hash: hash })
    }).then(function (r) {
      if (r.status === 401) return { wrong: true };
      if (!r.ok) return { offline: true };
      return r.json();
    }).catch(function () { return { offline: true }; });
  }
  function applyServerData(res) {
    if (res && res.db && Array.isArray(res.db.items)) {
      DB = res.db;
      try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch (e) {}
      if (bc) { try { bc.postMessage({ type:'update', rev: DB.rev }); } catch (e) {} }
    } else if (res && res.empty) {
      doPush(); // أول مرة: ارفع البيانات المحلية للخادم
    }
  }

  function boot() {
    if (isLoggedIn() && getAuth()) {
      serverLogin(getAuth()).then(function (res) {
        if (res.wrong) { setLoggedIn(false); setAuth(''); return boot(); }
        applyServerData(res);
        startApp();
      });
    } else if (isLoggedIn()) {
      startApp();
    }
    else {
      $('#login').classList.remove('hidden');
      $('#app').classList.add('hidden');
      setTimeout(function () { $('#pw').focus(); }, 120);
    }
  }

  function startApp() {
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    setView('overview');
  }

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var val = $('#pw').value;
    sha256(val).then(function (h) {
      serverLogin(h).then(function (res) {
        var ok = res.wrong ? false : (res.offline ? h === DB.security.passHash : true);
        if (!ok) {
          showErr('loginErr', 'كلمة المرور غير صحيحة');
          $('#pw').value = '';
          $('#pw').focus();
          return;
        }
        showErr('loginErr', '');
        setLoggedIn(true);
        setAuth(h);
        applyServerData(res);
        startApp();
      });
    });
  });

  $('#tabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (t) setView(t.getAttribute('data-view'));
  });

  /* استقبال التغييرات القادمة من تبويب آخر (مثلاً بعد الاستيراد) */
  if (bc) bc.onmessage = function (e) {
    if (e.data && e.data.type === 'update') {
      DB = readDB();
      if (view !== 'products' && view !== 'categories') render();
    }
  };
  window.addEventListener('storage', function (e) {
    if (e.key === DB_KEY) { DB = readDB(); render(); }
  });

  boot();
})();
</script>
