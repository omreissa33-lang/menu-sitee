<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>المنيو</title>
<style>
/* ===================== design tokens (overridden by JS) ===================== */
:root{
  --bg:#0b0a08; --surface:#17130e; --surface-2:#1f1912; --text:#f5efe3; --muted:#b4a68d;
  --primary:#d4af37; --on-primary:#191307; --border:rgba(255,255,255,.09);
  --radius:18px; --font:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  --shadow:0 18px 46px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 70% at 88% -8%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 62%),
    var(--bg);
  color:var(--text); font-family:var(--font); line-height:1.7;
  min-height:100vh; padding-bottom:40px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}

/* ===================== header ===================== */
.hero{position:relative;padding:34px 0 20px;text-align:center}
.logo{
  width:86px;height:86px;margin:0 auto 14px;border-radius:26px;overflow:hidden;flex:none;
  background:linear-gradient(145deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000));
  display:grid;place-items:center;color:var(--on-primary);font-size:2rem;font-weight:900;
  box-shadow:0 16px 40px color-mix(in srgb,var(--primary) 26%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{
  margin:0 0 6px;font-size:clamp(1.55rem,5vw,2.3rem);font-weight:800;letter-spacing:-.2px;
  text-shadow:0 2px 20px rgba(0,0,0,.35);
}
.hero p{margin:0;color:var(--muted);font-size:.95rem;max-width:52ch;margin-inline:auto}
.hero-meta{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:.8rem;color:var(--muted)
}
.chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--surface) 80%,transparent);padding:5px 12px;border-radius:999px;
}
.chip svg{width:14px;height:14px;color:var(--primary)}
.open-dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.open-dot.closed{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.18)}

/* ===================== controls ===================== */
.controls{position:sticky;top:0;z-index:30;padding:10px 0;margin-bottom:6px;
  background:linear-gradient(180deg,var(--bg) 55%,color-mix(in srgb,var(--bg) 70%,transparent) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search{position:relative;margin-bottom:9px}
.search svg{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{
  width:100%;padding:12px 44px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:inherit;font-size:.92rem;outline:none;transition:border-color .15s
}
.search input:focus{border-color:color-mix(in srgb,var(--primary) 60%,transparent)}
.search input::placeholder{color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:999px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .16s;white-space:nowrap;
}
.cat:hover{border-color:color-mix(in srgb,var(--primary) 45%,transparent)}
.cat.active{background:var(--primary);color:var(--on-primary);border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 30%,transparent)}
.cat small{opacity:.6;margin-inline-start:4px;font-size:.72rem}

/* ===================== sections & items ===================== */
.section{margin:26px 0 8px}
.section-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:1.08rem;font-weight:800}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 45%,transparent),transparent)}
.grid{display:grid;gap:13px;grid-template-columns:1fr;align-items:stretch}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.card-img{aspect-ratio:4/3}}
.grid.list{grid-template-columns:1fr!important}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s;
  cursor:pointer;text-align:start;font:inherit;color:inherit;padding:0;width:100%;
}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--primary) 40%,transparent);box-shadow:var(--shadow)}
.card-img{position:relative;aspect-ratio:16/10;background:var(--surface-2);overflow:hidden;flex:none;width:100%}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .card-img img{transform:scale(1.05)}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:2.4rem;font-weight:900;
  color:color-mix(in srgb,var(--primary) 70%,transparent);
  background:linear-gradient(145deg,color-mix(in srgb,var(--primary) 12%,var(--surface-2)),var(--surface-2))}
.badge{
  position:absolute;top:10px;inset-inline-start:10px;font-size:.68rem;font-weight:800;
  padding:4px 10px;border-radius:999px;backdrop-filter:blur(8px);
}
.badge.hot{background:color-mix(in srgb,var(--primary) 92%,#000);color:var(--on-primary)}
.badge.out{background:rgba(0,0,0,.66);color:#fca5a5;border:1px solid rgba(248,113,113,.35)}
.card-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px;flex:1;justify-content:flex-start}
.card-body h3{margin:0;font-size:1rem;font-weight:700;line-height:1.4}
.card-body p{margin:0;color:var(--muted);font-size:.82rem;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin-top:auto;padding-top:10px;font-weight:800;font-size:1.02rem;color:var(--primary);
  display:flex;align-items:baseline;gap:5px}
.price small{font-size:.72rem;font-weight:600;color:var(--muted)}
.card.unavailable{opacity:.62}
.card.unavailable .price{color:var(--muted)}

/* list layout */
.grid.list .card{flex-direction:row;align-items:stretch}
.grid.list .card-img{width:118px;aspect-ratio:auto;flex:none}
.grid.list .card-body{padding:11px 13px}
.grid.list .card-body p{-webkit-line-clamp:1}

/* ===================== empty / footer ===================== */
.empty{text-align:center;padding:60px 18px;color:var(--muted)}
.empty .ico{width:74px;height:74px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--primary) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--primary) 26%,transparent)}
.empty .ico svg{width:32px;height:32px;color:var(--primary);opacity:.85}
.empty h3{margin:0 0 6px;color:var(--text);font-size:1.05rem}
.empty p{margin:0;font-size:.87rem}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.78rem}
footer .brandline{color:var(--primary);font-weight:700;letter-spacing:.4px}

/* ===================== item modal ===================== */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);animation:fade .2s}
.sheet-card{
  position:absolute;inset-inline:0;bottom:0;max-height:92vh;overflow:auto;
  background:var(--surface);border-radius:26px 26px 0 0;border-top:1px solid var(--border);
  animation:up .28s cubic-bezier(.2,.8,.3,1);
}
@media(min-width:640px){
  .sheet-card{inset:auto;top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
    width:min(560px,92vw);border-radius:24px;border:1px solid var(--border);animation:fade .2s}
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--surface-2)}
.sheet-body{padding:18px 18px 24px}
.sheet-body h2{margin:0 0 6px;font-size:1.25rem}
.sheet-body .desc{color:var(--muted);font-size:.9rem;margin:0 0 16px;white-space:pre-wrap}
.sheet-price{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:14px;border-top:1px solid var(--border)}
.sheet-price strong{font-size:1.4rem;color:var(--primary)}
.close-x{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--border);background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:2}
.toast{position:fixed;inset-inline:12px;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:90}
.toast span{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:9px 18px;border-radius:999px;font-size:.82rem;opacity:0;transform:translateY(8px);transition:.25s}
.toast.show span{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="logo" id="logoBox">م</div>
    <h1 id="rName">مطعمي</h1>
    <p id="rTag">منيو إلكتروني</p>
    <div class="hero-meta" id="heroMeta"></div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث في المنيو…" autocomplete="off">
    </div>
    <div class="cats" id="cats"></div>
  </div>
  <main id="menuRoot"></main>
  <footer>
    <div class="brandline" id="footBrand">مطعمي</div>
    <div id="footInfo"></div>
  </footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" id="sheetCard"></div>
</div>
<div class="toast" id="toast"><span></span></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     طبقة البيانات المشتركة بين هذه الصفحة وصفحة التحكم
     ============================================================ */
  var DB_KEY = 'smos.data.v1';
  var CHANNEL = 'smos-sync';

  var PRESETS = {
    'luxury-gold': { name:'فاخر ذهبي', bg:'#0b0a08', surface:'#17130e', surface2:'#1f1912', text:'#f5efe3', muted:'#b4a68d', primary:'#d4af37', onPrimary:'#191307', font:'Cairo' },
    'royal-dark':  { name:'ملكي داكن', bg:'#0a0f14', surface:'#121b22', surface2:'#18242d', text:'#eef4f8', muted:'#9fb0bd', primary:'#c9a227', onPrimary:'#12181d', font:'Tajawal' },
    'elegant-cream': { name:'كريمي أنيق', bg:'#faf6ef', surface:'#ffffff', surface2:'#f3ece1', text:'#241d14', muted:'#7a6b57', primary:'#96702c', onPrimary:'#fff8ea', font:'Almarai' },
    'modern-minimal': { name:'حديث بسيط', bg:'#ffffff', surface:'#f7f7f8', surface2:'#efeff1', text:'#111315', muted:'#6b7075', primary:'#111315', onPrimary:'#ffffff', font:'Segoe UI' },
    'emerald':     { name:'زمردي', bg:'#05100c', surface:'#0c1f18', surface2:'#122a21', text:'#ecf7f2', muted:'#96b3a8', primary:'#2fbf8f', onPrimary:'#04150f', font:'Cairo' },
    'burgundy':    { name:'عنّابي', bg:'#140a0d', surface:'#221016', surface2:'#2c1620', text:'#f9edf1', muted:'#c0a3ac', primary:'#d4788f', onPrimary:'#1b0910', font:'El Messiri' }
  };

  function defaultDB() {
    var now = Date.now();
    return {
      version: 1, rev: 1, updatedAt: now,
      restaurant: { name:'مطعمي', tagline:'منيو إلكتروني', phone:'', address:'', hours:'', logo:'', currency:'ج.م' },
      design: { preset:'luxury-gold', primary:'', bg:'', radius:18, layout:'grid', showSearch:true },
      categories: [{ id:'c1', name:'الأطباق الرئيسية', sort:1 }],
      items: [],
      security: { passHash: 'ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f', hint: '' }
    };
  }

  var REMOTE = null, CACHE_KEY = 'smos.menu.cache';
  function normDB(d) {
    d.restaurant = d.restaurant || defaultDB().restaurant;
    d.design = d.design || defaultDB().design;
    d.categories = Array.isArray(d.categories) ? d.categories : [];
    d.items = Array.isArray(d.items) ? d.items : [];
    d.security = d.security || defaultDB().security;
    return d;
  }
  function readLocalDB() {
    try {
      var raw = localStorage.getItem(DB_KEY);
      if (!raw) {
        var seed = defaultDB();
        try { localStorage.setItem(DB_KEY, JSON.stringify(seed)); } catch (e) {}
        return seed;
      }
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return defaultDB();
      d.restaurant = d.restaurant || defaultDB().restaurant;
      d.design = d.design || defaultDB().design;
      d.categories = Array.isArray(d.categories) ? d.categories : [];
      d.items = Array.isArray(d.items) ? d.items : [];
      d.security = d.security || defaultDB().security;
      return d;
    } catch (e) { return defaultDB(); }
  }
  // يستخدم الأحدث: نسخة الخادم أو نسخة نفس المتصفح (لمعاينة لوحة الإدارة)
  function readDB() {
    var local = readLocalDB();
    if (!REMOTE) {
      try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && Array.isArray(c.items)) REMOTE = c; } catch (e) {}
    }
    if (REMOTE && (REMOTE.rev || 0) >= (local.rev || 0) && !(local.rev > 1 && local.updatedAt > REMOTE.updatedAt)) return normDB(JSON.parse(JSON.stringify(REMOTE)));
    return local;
  }
  function pullRemote() {
    if (!/^https?:$/.test(location.protocol)) return;
    fetch('/api/data?since=' + (REMOTE ? REMOTE.rev : 0), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.db) return;
        REMOTE = j.db;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(REMOTE)); } catch (e) {}
        var before = DB.rev; DB = readDB();
        renderAll();
      }).catch(function () {});
  }

  var DB = readDB();

  /* ============================================================
     تطبيق التصميم
     ============================================================ */
  function applyDesign() {
    var d = DB.design || {};
    var p = PRESETS[d.preset] || PRESETS['luxury-gold'];
    var root = document.documentElement.style;
    root.setProperty('--bg', d.bg || p.bg);
    root.setProperty('--surface', p.surface);
    root.setProperty('--surface-2', p.surface2);
    root.setProperty('--text', p.text);
    root.setProperty('--muted', p.muted);
    root.setProperty('--primary', d.primary || p.primary);
    root.setProperty('--on-primary', p.onPrimary);
    root.setProperty('--radius', (d.radius || 18) + 'px');
    var fam = p.font || 'Cairo';
    root.setProperty('--font', '"' + fam + '","Cairo","Segoe UI",Tahoma,Arial,sans-serif');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', d.bg || p.bg);
  }

  /* ============================================================
     عرض المنيو
     ============================================================ */
  var state = { cat: 'all', q: '' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function money(v) {
    var n = Number(v) || 0;
    var s = (n % 1 === 0) ? String(n) : n.toFixed(2);
    return s;
  }
  function currency() { return DB.restaurant.currency || 'ج.م'; }

  function renderHero() {
    var r = DB.restaurant;
    document.title = r.name || 'المنيو';
    document.getElementById('rName').textContent = r.name || 'مطعمي';
    document.getElementById('rTag').textContent = r.tagline || '';
    document.getElementById('footBrand').textContent = r.name || 'مطعمي';

    var logo = document.getElementById('logoBox');
    if (r.logo) logo.innerHTML = '<img alt="" src="' + r.logo + '">';
    else logo.textContent = (r.name || 'م').trim().charAt(0);

    var meta = [];
    if (r.hours) meta.push('<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' + esc(r.hours) + '</span>');
    if (r.phone) meta.push('<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>' + esc(r.phone) + '</span>');
    if (r.address) meta.push('<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>' + esc(r.address) + '</span>');
    var openNow = isOpenNow(r.hours);
    if (openNow !== null) {
      meta.unshift('<span class="chip"><span class="open-dot' + (openNow ? '' : ' closed') + '"></span>' + (openNow ? 'مفتوح الآن' : 'مغلق حاليًا') + '</span>');
    }
    document.getElementById('heroMeta').innerHTML = meta.join('');
    document.getElementById('footInfo').textContent = [r.address, r.phone].filter(Boolean).join(' · ');
  }

  /* "10:00 - 23:00" → هل المطعم مفتوح الآن؟ (توقيت جهاز الزائر) */
  function isOpenNow(hours) {
    if (!hours) return null;
    var m = String(hours).match(/(\d{1,2})\s*[:.]?\s*(\d{2})?\s*[-–—إلى]+\s*(\d{1,2})\s*[:.]?\s*(\d{2})?/);
    if (!m) return null;
    var from = (+m[1]) * 60 + (+(m[2] || 0));
    var to = (+m[3]) * 60 + (+(m[4] || 0));
    var now = new Date(); var cur = now.getHours() * 60 + now.getMinutes();
    return from <= to ? (cur >= from && cur < to) : (cur >= from || cur < to);
  }

  function renderCats() {
    var cats = (DB.categories || []).slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    var total = DB.items.length;
    var html = '<button class="cat' + (state.cat === 'all' ? ' active' : '') + '" data-cat="all">الكل <small>' + total + '</small></button>';
    cats.forEach(function (c) {
      var n = DB.items.filter(function (i) { return i.categoryId === c.id; }).length;
      html += '<button class="cat' + (state.cat === c.id ? ' active' : '') + '" data-cat="' + esc(c.id) + '">' + esc(c.name) + ' <small>' + n + '</small></button>';
    });
    document.getElementById('cats').innerHTML = html;
  }

  function itemCard(it) {
    var img = it.image
      ? '<img alt="" loading="lazy" src="' + it.image + '">'
      : '<div class="ph">' + esc((it.name || '؟').trim().charAt(0)) + '</div>';
    var badges = '';
    if (it.featured) badges += '<span class="badge hot">مميز</span>';
    if (it.available === false) badges += '<span class="badge out">غير متوفر</span>';
    var price = it.price === null || it.price === undefined || it.price === ''
      ? '' : '<div class="price">' + money(it.price) + ' <small>' + esc(currency()) + '</small></div>';
    return '<button class="card' + (it.available === false ? ' unavailable' : '') + '" data-id="' + esc(it.id) + '">' +
      '<div class="card-img">' + img + badges + '</div>' +
      '<div class="card-body"><h3>' + esc(it.name) + '</h3>' +
      (it.desc ? '<p>' + esc(it.desc) + '</p>' : '') + price + '</div></button>';
  }

  function filtered() {
    var q = state.q.trim().toLowerCase();
    return DB.items.filter(function (it) {
      if (state.cat !== 'all' && it.categoryId !== state.cat) return false;
      if (!q) return true;
      return (it.name || '').toLowerCase().indexOf(q) > -1 || (it.desc || '').toLowerCase().indexOf(q) > -1;
    }).sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
  }

  function renderMenu() {
    var root = document.getElementById('menuRoot');
    var layout = (DB.design && DB.design.layout) || 'grid';
    var list = filtered();

    if (!DB.items.length) {
      root.innerHTML = '<div class="empty"><div class="ico">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-1.7 1.4-2.5 3.3-2.5 5.5S15.3 12 17 13v8"/></svg>' +
        '</div><h3>المنيو قيد الإعداد</h3><p>لم تُضف أطباق بعد. تابعنا قريبًا.</p></div>';
      return;
    }
    if (!list.length) {
      root.innerHTML = '<div class="empty"><div class="ico">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
        '</div><h3>لا توجد نتائج</h3><p>جرّب كلمة بحث أخرى أو اختر قسمًا مختلفًا.</p></div>';
      return;
    }

    if (state.cat !== 'all') {
      root.innerHTML = '<div class="section"><div class="grid ' + layout + '">' + list.map(itemCard).join('') + '</div></div>';
      return;
    }

    // grouped by category
    var cats = (DB.categories || []).slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    var html = '';
    cats.forEach(function (c) {
      var its = list.filter(function (i) { return i.categoryId === c.id; });
      if (!its.length) return;
      html += '<section class="section"><h2 class="section-title">' + esc(c.name) + '</h2>' +
        '<div class="grid ' + layout + '">' + its.map(itemCard).join('') + '</div></section>';
    });
    var orphans = list.filter(function (i) { return !cats.some(function (c) { return c.id === i.categoryId; }); });
    if (orphans.length) {
      html += '<section class="section"><h2 class="section-title">أصناف أخرى</h2>' +
        '<div class="grid ' + layout + '">' + orphans.map(itemCard).join('') + '</div></section>';
    }
    root.innerHTML = html;
  }

  function renderAll() { applyDesign(); renderHero(); renderCats(); renderMenu(); }

  /* ============================================================
     تفاصيل الصنف
     ============================================================ */
  function openItem(id) {
    var it = DB.items.filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    var tagline = DB.restaurant.name || '';
    var card = document.getElementById('sheetCard');
    card.innerHTML =
      '<button class="close-x" data-close aria-label="إغلاق">' +
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
      (it.image ? '<img class="sheet-img" alt="" src="' + it.image + '">' : '') +
      '<div class="sheet-body">' +
        '<h2>' + esc(it.name) + '</h2>' +
        (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : '') +
        '<div class="sheet-price"><strong>' + (it.price === '' || it.price == null ? '—' : money(it.price) + ' ' + esc(currency())) + '</strong>' +
        (it.available === false ? '<span class="badge out" style="position:static">غير متوفر حاليًا</span>' : '<span style="color:var(--muted);font-size:.8rem">' + esc(tagline) + '</span>') +
        '</div></div>';
    document.getElementById('sheet').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    document.getElementById('sheet').classList.remove('open');
    document.body.style.overflow = '';
  }

  /* ============================================================
     تحديث حيّ عند تغيّر البيانات
     ============================================================ */
  var bc = null;
  try { bc = new BroadcastChannel(CHANNEL); } catch (e) { bc = null; }

  function announce(msg) { if (bc) { try { bc.postMessage(msg); } catch (e) {} } }

  function reload(from) {
    var before = DB.rev;
    DB = readDB();
    if (DB.rev === before) return;
    renderAll();
    if (from !== 'silent') toast('تم تحديث المنيو ✓');
  }

  window.addEventListener('storage', function (e) {
    if (e.key === DB_KEY) reload('storage');
  });
  if (bc) bc.onmessage = function (e) {
    if (!e.data || e.data.type !== 'update') return;
    DB = readDB(); renderAll(); toast('تم تحديث المنيو ✓');
  };
  // شبكة أمان: فحص دوري لو حدث تغيير ولم يصل الحدث
  setInterval(function () {
    var before = DB.rev;
    var fresh = readDB();
    if (fresh.rev !== before) { DB = fresh; renderAll(); }
  }, 2500);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { DB = readDB(); renderAll(); }
  });

  var toastT;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.firstElementChild.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  /* ============================================================
     الأحداث
     ============================================================ */
  document.getElementById('cats').addEventListener('click', function (e) {
    var b = e.target.closest('.cat');
    if (!b) return;
    state.cat = b.getAttribute('data-cat');
    renderCats(); renderMenu();
  });
  var qEl = document.getElementById('q');
  qEl.addEventListener('input', function () {
    state.q = qEl.value;
    renderMenu();
  });
  document.getElementById('menuRoot').addEventListener('click', function (e) {
    var c = e.target.closest('.card');
    if (c) openItem(c.getAttribute('data-id'));
  });
  document.getElementById('sheet').addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) closeSheet();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* أول رسم */
  renderAll();
  pullRemote();
  setInterval(pullRemote, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pullRemote(); });
})();
</script>
</body>
</html>
